# cSpell:words jstemmer benchmem goreleaser
name: Test, Build and Publish

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    tags:
      - "*"

permissions:
  contents: write

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install junit report
        run: go install github.com/jstemmer/go-junit-report/v2@latest
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@latest
      - name: Create mocks
        run: mockery
      - name: Run tests
        run: go test -cover -bench=. -benchmem -race -v 2>&1 ./... | go-junit-report -set-exit-code > report.xml
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: |
            report.xml
        if: always()

  goreleaser:
    name: Build and Publish
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # GITHUB_TOKEN：用于在本 repo 建 Release / 上传 archives。
          # secrets.GITHUB_TOKEN 是 Actions 自动注入的、对当前 repo 有 contents:write 权限。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_PAT：跨 repo 用。由 .goreleaser.yaml 的 brews.repository.token 引用，
          # 用来 push formula 到 Wingsdh/homebrew-tap（GITHUB_TOKEN 没法跨 repo）。
          GH_PAT: ${{ secrets.GH_PAT }}

  check_brew:
    name: Check Brew Tap
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - name: Install with brew
        run: |
          brew install Wingsdh/tap/cc-sesh
      # TODO: assert the latest version was installed
