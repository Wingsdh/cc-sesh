name: Bug Report
description: File a bug report
labels: ["bug", "triage"]
assignees:
  - Wingsdh
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

        Note: cc-sesh is a fork of [joshmedeski/sesh](https://github.com/joshmedeski/sesh) that adds Claude Code live status to the picker. If your bug is about core sesh behavior (session management, picker basics, configuration), please reproduce it on upstream sesh first and report it [there](https://github.com/joshmedeski/sesh/issues) — they can fix it for everyone. Bugs specific to the Claude Code integration or the cc-sesh-only changes belong here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: When I _, I expected _ but _ happened!
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of cc-sesh are you using? (`cc-sesh --version`)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
  - type: checkboxes
    id: review
    attributes:
      label: Reviewed
      options:
        - label: Reviewed existing issues and made sure this bug has not already been submitted.
          required: true
        - label: This bug is specific to cc-sesh (not reproducible on upstream sesh), or is about the Claude Code integration.
          required: false
